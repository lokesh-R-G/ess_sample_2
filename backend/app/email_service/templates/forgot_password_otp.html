{% extends "base.html" %}

{% block content %}
<p>We received a request to reset your password.</p>
<p>Your One-Time Password (OTP) is:</p>
<h2 style="font-size: 32px; letter-spacing: 5px; color: #2c3e50; text-align: center;">{{ otp }}</h2>
<p>This OTP will expire at {{ expiry_time }}.</p>
<div class="alert">
    Warning: Never share this OTP with anyone, including HR or IT support.
</div>
{% endblock %}
